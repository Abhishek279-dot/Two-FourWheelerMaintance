<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SV Motors - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-container">

        <div class="login-card">

            <!-- =========================
                 LEFT SIDE - VISUAL
            ========================== -->

            <div class="login-visual">

                <img src="banner.jpeg" alt="SV Motors Banner">

                <div>
                    <div class="scooter-badge">
                        © 2026 SV Motors. All Rights Reserved.
                    </div>
                </div>

            </div>


            <!-- =========================
                 RIGHT SIDE - LOGIN FORM
            ========================== -->

            <div class="login-form-side">

                <div class="brand-row">

                    <div class="login">
                        <h2>LOGIN</h2>
                    </div>

                </div>


                <!-- Login Form -->

                <form id="loginForm">

                    <div class="form-grid">

                        <!-- Dealer Code -->

                        <div class="field full">

                            <label for="dealerCode">
                                Dealer Code
                            </label>

                            <input type="text" id="dealerCode" required>

                        </div>


                        <!-- Role -->

                        <div class="field">

                            <label for="role">
                                Role
                            </label>

                            <select id="role" required>

                                <option value="">
                                    Select Role
                                </option>

                                <option value="ADMIN">
                                    ADMIN
                                </option>

                                <option value="MANAGER">
                                    MANAGER
                                </option>

                                <option value="MECHANIC">
                                    MECHANIC
                                </option>

                            </select>

                        </div>


                        <!-- Branch -->

                        <div class="field">

                            <label for="branch">
                                Branch
                            </label>

                            <select id="branch" required>

                                <option value="">
                                    Select Branch
                                </option>

                                <option value="SWAMI">
                                    SWAMI Service Center
                                </option>

                                <option value="ADVAIT">
                                    ADVAIT Service Care
                                </option>

                                <option value="SAI">
                                    SAI Service
                                </option>

                                <option value="SHREE">
                                    SHREE Service Care
                                </option>

                            </select>

                        </div>


                        <!-- User ID -->

                        <div class="field full">

                            <label for="userId">
                                User ID
                            </label>

                            <input
                                type="text"
                                id="userId"
                                autocomplete="new-username"
                                required
                            >

                        </div>


                        <!-- Password -->

                        <div class="field full">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter password"
                                autocomplete="new-password"
                                required
                            >

                        </div>


                        <!-- Login Button -->

                        <div class="field full">

                            <button type="submit" class="btn btn-primary" id="sendOtpBtn" onlick="function">
                                Click To Login
                            </button>

                        </div>

                    </div>

                </form>
                <p id="errorMsg" style="color:red; display:none;"></p>

            </div>

        </div>

    </div>
    

    <!-- JavaScript -->

    <script>

document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault(); // page reload rokne ke liye
  
  const userId = document.getElementById("userId").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorMsg = document.getElementById("errorMsg");

  // Abhi ke liye dummy check (baad me backend API se replace hoga)
  if (userId === "admin" && password === "admin123") {
    localStorage.setItem("userRole", "admin"); // role save kar rahe hai
    window.location.href = "HomePage.html";   // redirect
  }else if(userId === "manager" && password === "manager123"){
    localStorage.setItem("userRole", "manager"); // role save kar rahe hai
    window.location.href = "HomePage.html";   // redirect
  
  } else {
    errorMsg.textContent = "Invalid User ID or Password";
    errorMsg.style.display = "block";
  }
});


    </script>

</body>

</html>
