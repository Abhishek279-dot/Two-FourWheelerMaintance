<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service History — AutoLine DMS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="overlay-bg" id="overlayBg"></div>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:10px;">
        <div></div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-outline btn-sm" id="exportBtn">⬇ Export CSV</button>
          <a href="jobcard-create.html" class="btn btn-primary btn-sm">+ New Job Card</a>
        </div>
      </div>

      <div class="table-wrap">
        <div class="filters-row">
          <div class="field"><label>Frame No</label><input id="fFrame" placeholder="Search"></div>
          <div class="field"><label>Registration No</label><input id="fReg" placeholder="Search"></div>
          <div class="field"><label>Customer</label><input id="fCustomer" placeholder="Search"></div>
          <div class="field"><label>Status</label>
            <select id="fStatus">
              <option value="">All</option>
              <option>Allocated</option>
              <option>Job Completed</option>
              <option>Closed</option>
            </select>
          </div>
          <div class="field"><label>Job Type</label>
            <select id="fType">
              <option value="">All</option>
              <option>Running Repair</option>
              <option>Paid Service</option>
              <option>1st Free Service</option>
              <option>2nd Free Service</option>
              <option>3rd Free Service</option>
            </select>
          </div>
        </div>
        <div class="table-toolbar">
          <div class="count" id="rowCount"></div>
        </div>
        <table id="jcTable">
          <thead>
            <tr>
              <th>Job Card No</th><th>Frame No</th><th>Reg No</th><th>Customer</th><th>Model</th>
              <th>Job Type</th><th>Mechanic</th><th>Status</th><th>Date</th><th>Total (₹)</th><th></th>
            </tr>
          </thead>
          <tbody id="jcBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none;">
          <div class="ic">🗂️</div>
          No job cards match these filters. Try clearing a filter.
        </div>
      </div>

    </div>
  </div>
</div>

<script src="Images/js/app.js"></script>
<script>
requireLogin();
buildShell("jobcard-list.html", "Service / Vehicle Service History", "All job cards across " + DMS.get().session.branch);

function render() {
  const data = DMS.get();
  const params = new URLSearchParams(window.location.search);
  const q = (params.get("q") || "").toLowerCase();

  const fFrame = document.getElementById("fFrame").value.toLowerCase();
  const fReg = document.getElementById("fReg").value.toLowerCase();
  const fCustomer = document.getElementById("fCustomer").value.toLowerCase();
  const fStatus = document.getElementById("fStatus").value;
  const fType = document.getElementById("fType").value;

  let rows = data.jobCards.filter(r => {
    if (q && !(r.id.toLowerCase().includes(q) || r.frameNo.toLowerCase().includes(q) || r.regNo.toLowerCase().includes(q) || r.customer.toLowerCase().includes(q))) return false;
    if (fFrame && !r.frameNo.toLowerCase().includes(fFrame)) return false;
    if (fReg && !r.regNo.toLowerCase().includes(fReg)) return false;
    if (fCustomer && !r.customer.toLowerCase().includes(fCustomer)) return false;
    if (fStatus && r.status !== fStatus) return false;
    if (fType && r.jobType !== fType) return false;
    return true;
  });

  document.getElementById("rowCount").textContent = rows.length + " total";
  document.getElementById("emptyState").style.display = rows.length ? "none" : "block";
  document.getElementById("jcTable").style.display = rows.length ? "table" : "none";

  document.getElementById("jcBody").innerHTML = rows.map(r => `
    <tr>
      <td><a href="jobcard-create.html?id=${r.id}">${r.id}</a></td>
      <td>${r.frameNo}</td>
      <td>${r.regNo}</td>
      <td>${r.customer}</td>
      <td>${r.model}</td>
      <td>${r.jobType}</td>
      <td>${r.mechanic}</td>
      <td>${statusPill(r.status)}</td>
      <td>${r.date}</td>
      <td>₹${(r.labourTotal + r.partsTotal).toLocaleString('en-IN')}</td>
      <td><a href="jobcard-create.html?id=${r.id}" class="btn btn-outline btn-sm">Open</a></td>
    </tr>`).join("");
}

["fFrame","fReg","fCustomer","fStatus","fType"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});

document.getElementById("exportBtn").addEventListener("click", () => {
  exportTableToCSV("jcTable", "service-history.csv");
  showToast("CSV exported ✓", "success");
});

render();
</script>
</body>
</html>
