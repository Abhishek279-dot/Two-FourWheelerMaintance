<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <div class="main-container">
        <div class="header">

              <i class="fa-solid fa-user" class="userProfile"></i>
            </div>
        </div>

        <div class="menu">

            <div class="container">
    <div class="categories-grid">
      <div class="category-item">
        <div class="category-circle">
                    <img src="Images/JobCard.jpeg" alt="JobCard">

        </div>
        <h3><pre> Job Card</pre></h3>
      </div>
      <div class="category-item">
        <div class="category-circle">
                <img src="Images/JCCatlogeBlack.jpeg" alt="JobCard">


        </div>
        <h3><pre> JC Catloge</pre></h3>
      </div>
      <div class="category-item">
        <div class="category-circle">
            <img src="Images/vehicleHistoryBlack.jpeg" alt="JobCard">

        </div>
        <h3><pre>  V-History </pre></h3>
      </div>
      <div class="category-item">
        <div class="category-circle">
                  <img src="Images/ECatlogeBlack.jpeg" alt="JobCard">

        </div>

      </div> 


      <div class="category-item">

  </div>
        </div>
        
                   <!-- Banner Image Swiper -->
<div class="swiper banner-image-swiper">

    <div class="swiper-wrapper">

        <div class="swiper-slide">
            <img src="banner.png" alt="Banner 1">
        </div>

        <div class="swiper-slide">
            <img src="banner1.jpeg" alt="Banner 2">
        </div>

        <div class="swiper-slide">
            <img src="banner3.jpeg" alt="Banner 3">
        </div>

        <div class="swiper-slide">
            <img src="banner4.jpeg" alt="Banner 4">
        </div>

        <div class="swiper-slide">
            <img src="banner6.jpeg" alt="Banner 5">
        </div>

    </div>

    <!-- Previous / Next Buttons -->
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>

    <!-- Pagination -->
    <div class="swiper-pagination banner-image-pagination"></div>

</div>
        
    </div>


 

    

    <!-- Link to external JavaScript file -->
    <script src="HomePage.js"></script>
    <!-- <script src="https://unpkg.com/lucide@latest"></script>

    <script>
    lucide.createIcons(); -->
</script>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    const bannerSwiper = new Swiper(".banner-image-swiper", {

        loop: true,

        autoplay: {
            delay: 3000,
            disableOnInteraction: false
        },

        navigation: {
            nextEl: ".banner-image-swiper .swiper-button-next",
            prevEl: ".banner-image-swiper .swiper-button-prev"
        },

        pagination: {
            el: ".banner-image-pagination",
            clickable: true
        },

        speed: 700
    });
</script>

</body>
</html>
