<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCare | Vehicle Maintenance System</title>

    <!-- Link to external CSS Stylesheet -->
    <link rel="stylesheet" href="homepage.css">

        <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/11.0.5/swiper-bundle.min.css"
/>

</head>
<body>
    <div class="main-container">
        <header class="header">
            <div class="brand-lockup">
                <div class="brand-mark"><i class="fa-solid fa-screwdriver-wrench"></i></div>
                <div>
                    <p class="brand-name">SV Motors</p>
                    <span class="brand-caption">VEHICLE MAINTENANCE SYSTEM</span>
                </div>
            </div>

            <div class="header-account">
                <div class="account-copy">
                    <span class="account-label">SIGNED IN AS</span>
                    <h4 id="userRoleDisplay">Admin</h4>
                    <h6 id="userBranch">Swami Service Center</h6>
                </div>
                <div class="profile-circle" aria-label="User profile">
                    <i class="fa-solid fa-user userProfile"></i>
                </div>
            </div>
        </header>

        <section class="menu">
            <div class="container">
    <div class="categories-grid" aria-label="Service modules">

      <a class="category-item" href="jobcard-create.html" aria-label="Create a new job card">
        <div class="category-circle">
            <img src="Images/JobCard.jpeg" alt="Job Card">
        </div>
        <h3>Job Card</h3>
        <span class="category-note">Create & track</span>
      </a>

      <a class="category-item" href="jobcard-list.html" aria-label="Open job card catalog">
        <div class="category-circle">
            <img src="Images/JCCatlogeBlack.jpeg" alt="JC Catalog">
        </div>
        <h3>JC Catalog</h3>
        <span class="category-note">Service records</span>
      </a>
      <a class="category-item" href="vehicle-history.html" aria-label="Open vehicle history">
        <div class="category-circle">
            <img src="Images/vehicleHistoryBlack.jpeg" alt="Vehicle History">
        </div>
        <h3>Vehicle History</h3>
        <span class="category-note">Past inspections</span>
      </a>
      <a class="category-item" href="parts-catalog.html" aria-label="Open parts E-Catalog">
        <div class="category-circle">
            <img src="Images/ECatlogeBlack.jpeg" alt="E-Catalog">
        </div>
        <h3>E-Catalog</h3>
        <span class="category-note">Parts lookup</span>
      </a>


      <a class="category-item" href="inventory.html" aria-label="Open inventory">
        <div class="category-circle">
            <img src="Images/InoventryBlack.jpeg" alt="Inventory">
        </div>
        <h3>Inventory</h3>
        <span class="category-note">Stock control</span>
      </a>
    </div>
  </div>
        </section>
        
                   <!-- Banner Image Swiper -->
 <section class="banner-section" aria-label="Service center highlights">
 <div class="banner-label"><span class="section-kicker">SERVICE CENTER HIGHLIGHTS</span><span>Reliable service. Every ride.</span></div>
 <div class="swiper banner-image-swiper">

    <div class="swiper-wrapper">

        <div class="swiper-slide">
            <img src="Banner1.png" alt="Banner 1">
        </div>
        <div class="swiper-slide">
            <img src="Banner2.png" alt="Banner 2">
        </div>

        <div class="swiper-slide">
            <img src="Banner3.png" alt="Banner 3">
        </div>

        <div class="swiper-slide">
            <img src="Banner4.png" alt="Banner 4">
        </div>

        <div class="swiper-slide">
            <img src="Banner5.png" alt="Banner 5">
        </div>

    </div>

    <!-- Previous / Next Buttons -->
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>

    <!-- Pagination -->
    <div class="swiper-pagination banner-image-pagination"></div>

</div>
 </section>
        
    </div>
    

    <!-- Link to external JavaScript file -->
    <script src="HomePage.js"></script>
    <!-- <script src="https://unpkg.com/lucide@latest"></script>

    <script>
    lucide.createIcons(); -->
</script>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
    const bannerSwiper = new Swiper(".banner-image-swiper", {

        loop: true,

        autoplay: {
            delay: 3000,
            disableOnInteraction: false
        },

        navigation: {
            nextEl: ".banner-image-swiper .swiper-button-next",
            prevEl: ".banner-image-swiper .swiper-button-prev"
        },

        pagination: {
            el: ".banner-image-pagination",
            clickable: true
        },

        speed: 700
    });
</script>

</body>
</html>
