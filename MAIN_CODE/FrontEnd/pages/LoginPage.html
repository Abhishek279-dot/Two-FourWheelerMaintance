<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SV Motors - Login</title>

    <link rel="stylesheet" href="../css/LoginPage.css">
</head>

<body>

    <div class="background-container">

        <div class="login-card">

            <!-- =========================
                 LEFT SIDE - VISUAL
            ========================== -->

            <div class="login-visual">

                <img src="../Images/banners/banner.jpeg" alt="SV Motors Banner">

                <div>
                    <div class="scooter-badge">
                        © 2026 SV Motors. All Rights Reserved.
                    </div>
                </div>

            </div>


            <!-- =========================
                 RIGHT SIDE - LOGIN FORM
            ========================== -->

            <div class="login-form-side">

                <div class="brand-row">

                    <div class="login">
                        <h2>LOGIN</h2>
                    </div>

                </div>


                <!-- Login Form -->

                <form id="loginForm">

                    <div class="form-grid">

                        <!-- Dealer Code -->

                        <div class="field full">

                            <label for="dealerCode">
                                Dealer Code
                            </label>

                            <input type="text" id="dealerCode" required>

                        </div>


                        <!-- Role -->

                        <div class="field">

                            <label for="role">
                                Role
                            </label>

                            <select id="role" required>

                                <option value="">
                                    Select Role
                                </option>

                                <option value="Admin">
                                    Admin
                                </option>

                                <option value="Manager">
                                    Manager
                                </option>

                                <option value="Mechanic">
                                    Mechanic
                                </option>

                            </select>

                        </div>


                        <!-- Branch -->

                        <div class="field">

                            <label for="branch">
                                Branch
                            </label>

                            <select id="branch" required>

                                <option value="">
                                    Select Branch
                                </option>

                                <option value="Swami Service Center">
                                    Swami Service Center
                                </option>

                                <option value="Advait Service Care">
                                    Advait Service Care
                                </option>

                                <option value="Sumya Service Center">
                                    Sumya Service Center
                                </option>

                                <option value="Shree Service Care">
                                    Shree Service Care
                                </option>

                            </select>

                        </div>
                        <!-- User ID -->

                        <div class="field full">

                            <label for="userId">
                                User ID
                            </label>

                            <input type="text" id="userId" required>

                        </div>
                        <!-- Password -->

                        <div class="field full">

                            <label for="password">
                                Password
                            </label>

                            <input type="password" id="password" placeholder="Enter password" autocomplete="new-password" required>

                        </div>
                        <!-- Login Button -->

                        <div class="field full">

                            <button type="submit" class="btn btn-primary" id="sendOtpBtn">
                                Click To Login
                            </button>
                        </div>
                    </div>
                </form>
                <p id="errorMsg"></p>
            </div>
        </div>
    </div>
    

    <!-- JavaScript -->

    <script src="../js/LoginPage.js"></script>

</body>

</html>
