<html>
<head>

  <link rel="stylesheet" href="style.css">
</head>
<body>


<!-- Model Selection -->
<div class="parts-model-strip" id="modelStrip"></div>


<!-- Assembly View -->
<div id="assemblyView">

    <div class="panel-head">

        <h3>Select an Assembly</h3>

        <div class="sub" id="modelSub"></div>

    </div>

    <div id="assemblyGrid" class="assembly-grid"></div>

</div>


<!-- Parts Table View -->
<div id="partsTableView">

    <button
        class="btn btn-outline btn-sm"
        id="backBtn"
    >
        ← Back to assemblies
    </button>


    <div class="parts-layout">

        <!-- Assembly Diagram -->
        <div class="diagram-card">

            <div class="dc-head">

                <b id="diagTitle">
                    Assembly
                </b>

                <span id="diagFig"></span>

            </div>

            <div
                class="dc-body"
                id="diagSvg"
            ></div>

        </div>


        <!-- Parts Table -->
        <div class="table-wrap">

            <div class="table-toolbar">

                <div
                    class="count"
                    id="partsCountLbl"
                ></div>


                <input
                    type="text"
                    id="partSearch"
                    class="part-search"
                    placeholder="Search part no / name"
                >


                <button
                    class="btn btn-outline btn-sm"
                    id="exportPartsBtn"
                >
                    ⬇ Export
                </button>

            </div>


            <table id="partsCatTable">

                <thead>

                    <tr>
                        <th></th>
                        <th>Ref No</th>
                        <th>Part No</th>
                        <th>Part Name</th>
                        <th>NDP (₹)</th>
                        <th>MRP (₹)</th>
                        <th>MOQ</th>
                        <th>Remarks</th>
                    </tr>

                </thead>


                <tbody id="partsCatBody"></tbody>

            </table>

        </div>

    </div>

</div>


<!-- Job Card Cart -->
<div class="cart-fab">
    🛒 0 parts added — Add to Job Card
</div>

</body>
</html>
